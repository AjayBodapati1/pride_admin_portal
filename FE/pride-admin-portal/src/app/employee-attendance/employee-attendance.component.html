<div class="employee-attendance-container">
  <h2>Employee Attendance</h2>
  <form (ngSubmit)="onSubmit()" #employeeAttendanceForm="ngForm">
    <div>
      <label for="userId">Employee ID:</label>
      <input
        type="number"
        id="userId"
        name="userId"
        [(ngModel)]="id"
        required
      />
    </div>
    <div>
      <label for="fromDate">From Date:</label>
      <input type="date" id="fromDate" name="fromDate" [(ngModel)]="fromDate" />
    </div>
    <div>
      <label for="toDate">To Date:</label>
      <input type="date" id="toDate" name="toDate" [(ngModel)]="toDate" />
    </div>
    <button type="submit">Retrive</button>
  </form>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <div class="table-container">
    <h3>Results</h3>
    <table border="1" cellpadding="8" cellspacing="0">
      <thead>
        <tr>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let record of attendanceList">
          <td>{{ record.date }}</td>
          <td>{{ record.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
